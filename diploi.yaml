diploiVersion: v1.0
type: component
name: FastAPI
description: Official FastAPI component for Diploi

supportsAdditionalHosts: { serviceName: 'app'}

hosts:
  - name: FastAPI
    identifier: app
    port: 8000

images:
  - identifier: app
    prebuildImage: public.ecr.aws/p8t2q7f4/diploi/component-fastapi:[tag]

# Staging and production install the deployment's commit on its own machine, in the image above. Development runs the
# working copy instead
build:
  command: UV_COMPILE_BYTECODE=1 diploi-pm install --no-dev
  waitForImports: false
